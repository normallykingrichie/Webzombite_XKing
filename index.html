<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webzombite (Beta) - XKing</title>
<style>
:root { --fg:#f1ece2; --muted:#a9a193; --bg:#12100d; --card:#1c1914; --line:#3a352c; --gold:#e3b02a; --bad:#e5484d; --ok:#4fd08a; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a08; color: var(--fg); user-select: none; -webkit-user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: #2a251d; color: var(--fg); font-weight: 700; text-decoration: none; font-size: .92rem; }
.btn:hover { background: #38322a; }
.btn.primary { background: var(--gold); color: #1a1405; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.screen { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(8, 7, 5, .76); backdrop-filter: blur(4px); overflow: auto; }
.screen .card { width: min(600px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.card h1 { margin: 0; font-size: 1.9rem; letter-spacing: -.01em; }
.card h1 b { color: var(--gold); }
.card h2 { margin: 0; font-size: 1.15rem; }
.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: .93rem; }
.card .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card input[type=text], .card textarea { width: 100%; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #100e0b; color: var(--fg); font: inherit; user-select: text; -webkit-user-select: text; }
.card input[type=text] { min-height: 44px; }
.card textarea { min-height: 92px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: .8rem; word-break: break-all; }
.tag { display: inline-block; align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: rgba(227,176,42,.18); color: var(--gold); font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.err { color: #ff8b8f; font-weight: 700; min-height: 1.1em; font-size: .88rem; }
.okmsg { color: var(--ok); font-weight: 700; font-size: .88rem; }
.warn-note { padding: 10px 12px; border-radius: 12px; background: rgba(227,176,42,.1); border: 1px solid rgba(227,176,42,.3); font-size: .85rem; color: #f3dc98; line-height: 1.45; }
.box-sub { padding: 12px; border-radius: 14px; background: #14110d; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.code-pill { display: inline-block; padding: 4px 12px; border-radius: 10px; background: #100e0b; border: 1px solid var(--gold); color: var(--gold); font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 1.05rem; letter-spacing: .12em; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; font-size: .82rem; }
.plist span { padding: 3px 10px; border-radius: 999px; background: #26211a; border: 1px solid var(--line); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .84rem; color: var(--muted); }
.keys b { color: var(--fg); }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
#cross::before, #cross::after { content: ""; position: absolute; background: rgba(255,255,255,.85); box-shadow: 0 0 2px #000; }
#cross::before { left: 10px; top: 4px; width: 2px; height: 14px; }
#cross::after { top: 10px; left: 4px; height: 2px; width: 14px; }
#cross.on-zombie::before, #cross.on-zombie::after { background: #ff4b4b; }
#info { position: absolute; left: 14px; top: 12px; font-size: .84rem; line-height: 1.5; background: rgba(0,0,0,.42); padding: 8px 12px; border-radius: 12px; }
#mini { position: absolute; right: 14px; top: 34px; width: 170px; height: 170px; border-radius: 14px; border: 2px solid rgba(255,255,255,.25); background: #1a1814; opacity: .92; }
#altHint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(0,0,0,.62); padding: 5px 12px; border-radius: 999px; font-size: .78rem; display: none; align-items: center; gap: 8px; pointer-events: auto; }
#altHint.on { display: flex; }
#altHint button { min-height: 26px; padding: 0 10px; font-size: .74rem; }
#prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-size: 1rem; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
#prompt:empty { display: none; }
#eat { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); width: 220px; height: 22px; border-radius: 999px; background: rgba(0,0,0,.55); overflow: hidden; display: none; }
#eat i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); }
#eat span { position: relative; display: block; text-align: center; font-size: .78rem; line-height: 22px; }
#fps { position: absolute; right: 14px; top: 8px; z-index: 12; left: auto; transform: none; font-size: .72rem; background: rgba(0,0,0,.4); padding: 2px 8px; border-radius: 8px; }
#dbg { display: none; position: absolute; left: 14px; top: 130px; margin: 0; font: 600 .72rem ui-monospace, Consolas, monospace; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 10px; white-space: pre; }
#held { display: none !important; position: absolute; right: 9%; bottom: 14%; font-size: 5rem; transform-origin: 80% 90%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); transition: transform .08s; }
#held.swing { transform: rotate(-38deg) translate(-18px, -12px); }
#stats { position: absolute; left: 14px; bottom: 14px; width: 250px; display: flex; flex-direction: column; gap: 5px; }
.bar { position: relative; height: 18px; border-radius: 9px; background: rgba(0,0,0,.55); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .15s; }
.bar span { position: relative; display: flex; justify-content: space-between; padding: 0 8px; font-size: .7rem; line-height: 18px; letter-spacing: .04em; }
.b-hp i { background: #d63c46; } .b-hu i { background: #d98a1e; } .b-th i { background: #2f8fe0; } .b-en i { background: #d8c42a; } .b-co i { background: #9a62d8; }
#status { position: absolute; left: 14px; bottom: 150px; display: flex; gap: 8px; font-size: .8rem; }
#status span { padding: 4px 10px; border-radius: 999px; background: rgba(120,20,30,.75); }
#hotbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; }
.slot { position: relative; width: 58px; height: 58px; border-radius: 12px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.18); display: grid; place-items: center; font-size: 1.7rem; }
.slot.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(227,176,42,.35); }
.slot small { position: absolute; left: 5px; top: 2px; font-size: .62rem; color: #cfc6b6; }
.slot em { position: absolute; right: 5px; bottom: 2px; font-style: normal; font-size: .72rem; }
#feed { position: absolute; right: 14px; bottom: 90px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 340px; }
#feed div { background: rgba(0,0,0,.55); padding: 5px 12px; border-radius: 10px; font-size: .86rem; animation: fi .2s ease; }
#feed div.bad { background: rgba(140,25,35,.75); }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(190,10,20,.75)); opacity: 0; transition: opacity .35s; }
#dark { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 1s; }

.panel { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 14px; background: rgba(8,7,5,.78); backdrop-filter: blur(3px); overflow: auto; }
.inv-wrap { width: min(1040px, 100%); max-height: calc(100vh - 28px); display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; overflow: auto; max-height: calc(100vh - 100px); }
.box h2 { margin: 0 0 10px; font-size: 1.15rem; }
.top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.eq-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.eq-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: #14110d; color: var(--fg); font-size: .72rem; text-align: center; }
.eq-slot.on { border-color: var(--gold); background: rgba(227,176,42,.12); }
.eq-slot b { font-size: 1.45rem; font-weight: 400; }
.eq-slot small { color: var(--muted); font-size: .64rem; }
.eq-buff { font-size: .78rem; color: var(--ok); background: rgba(79,208,138,.1); border: 1px solid rgba(79,208,138,.25); padding: 7px 10px; border-radius: 10px; margin-bottom: 10px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.it { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line); background: #14110d; color: var(--fg); font-size: .7rem; text-align: center; }
.it:hover { border-color: var(--gold); }
.it b { font-size: 1.7rem; font-weight: 400; }
.it em { position: absolute; right: 6px; top: 4px; font-style: normal; font-weight: 800; font-size: .76rem; }
.detail { margin-top: 12px; padding: 12px; border-radius: 12px; background: #14110d; border: 1px dashed var(--line); font-size: .86rem; line-height: 1.5; min-height: 92px; }
.detail h3 { margin: 0 0 4px; font-size: 1rem; }
.detail .m { color: var(--muted); }
.rec { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #14110d; margin-bottom: 8px; }
.rec .cost { color: var(--muted); font-size: .78rem; }
.rec .cost .ok { color: var(--ok); } .rec .cost .no { color: #ff8b8f; }
.hb { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.hb .slot { cursor: pointer; pointer-events: auto; }
@media (max-width: 800px) { .inv-wrap { grid-template-columns: 1fr; } .box { max-height: none; } }
/* Mobile / tablet controls (only on touch-only devices; .touch is set by JS) */
#tc { display: none; position: fixed; inset: 0; z-index: 11; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
#tc.invm #tcJoy, #tc.invm #tcLook, #tc.invm .tcb:not([data-a="bag"]) { display: none; }
#tcJoy { position: absolute; left: 22px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; touch-action: none; }
#tcKnob { position: absolute; left: 41px; top: 41px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.45); }
#tcLook { position: absolute; right: 0; top: 90px; width: 48%; bottom: 250px; pointer-events: auto; touch-action: none; }
.tcb { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: rgba(20,20,20,.5); border: 2px solid rgba(255,255,255,.5); color: #fff; font: 700 .78rem sans-serif; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
.tcb.big { width: 74px; height: 74px; background: rgba(200,50,40,.55); }
.tcb.sm { width: 52px; height: 36px; border-radius: 10px; font-size: .7rem; }
.tcb.on, .tcb.lit { background: rgba(255,255,255,.4); color: #000; }
body.touch #altHint { display: none !important; }
body.touch #hotbar { pointer-events: auto; bottom: 8px; }
body.touch #hotbar .slot { pointer-events: auto; }
.ico.sp{display:inline-block;width:1.35em;height:1.35em;background-size:2000% 2000%;background-repeat:no-repeat;vertical-align:-.3em;pointer-events:none}.sp0{background-image:url(icons/atlas0.webp)}.sp1{background-image:url(icons/atlas1.webp)}.sp2{background-image:url(icons/atlas2.webp)}.sp3{background-image:url(icons/atlas3.webp)}
img.ico{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.3em;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div id="cross"></div>
  <div id="info"></div>
  <canvas id="mini" width="170" height="170" aria-label="Minimap"></canvas>
  <div id="altHint">
    <span>No mouse lock: use the Arrow Keys to look around &middot; P = Pause</span>
    <button type="button" class="btn sm" id="bTryLock">Lock Mouse</button>
  </div>
  <div id="prompt"></div>
  <div id="eat"><i></i><span></span></div>
  <div id="held"></div>
  <div id="stats"></div>
  <div id="status"></div>
  <div id="hotbar"></div>
  <div id="feed"></div>
  <div id="fps">-- FPS</div>
  <pre id="dbg"></pre>
  <div id="vig"></div>
  <div id="dark"></div>
</div>

<div id="inv" class="panel" hidden></div>
<div id="screen" class="screen"><div class="card"><h1><b>Webzombite</b></h1><p id="ld">Loading the 3D world...</p></div></div>

<script>
(function () {
  window.__wzFatal = false;
  function show(m) {
    window.__wzFatal = true;
    var s = document.getElementById('screen');
    if (!s) return;
    s.hidden = false;
    s.innerHTML = '<div class="card"><h1><b>Webzombite</b></h1><p>Something went wrong while loading the game.</p><pre style="white-space:pre-wrap;font-size:12px;opacity:.85">' + String(m).replace(/</g, '&lt;') + '</pre></div>';
  }
  window.__wzShowErr = show;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') {
      var src = t.getAttribute('src') || '';
      if (src.indexOf('three.min.js') >= 0) return;
      show('Could not load file: ' + src + '\nCheck that every file was uploaded next to index.html.');
    } else if (!t || t === window) {
      show((e.message || 'Script error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    }
  }, true);
  setTimeout(function () {
    if (!window.__wzFatal && (!window.WZ || !window.WZ.started)) {
      show('The game did not start. Press F12, open the Console tab, and send the red error to the developer.');
    }
  }, 10000);
})();
</script>

<script>
(function () {
  function loadFiles() {
    var files = ['vendor/supabase.js', 'config.js', 'icons/atlas.js', 'data.js', 'sound.js', 'world.js', 'net.js', 'game.js'];
    function next(i) {
      if (window.__wzFatal || i >= files.length) return;
      var s = document.createElement('script');
      s.src = files[i] + '?v=26';
      s.onload = function () { next(i + 1); };
      s.onerror = function () {
        if (files[i] === 'vendor/supabase.js') { next(i + 1); return; }
        if (window.__wzShowErr) window.__wzShowErr('Could not load file: ' + files[i]);
      };
      document.body.appendChild(s);
    }
    next(0);
  }
  function loadThree(urls, idx) {
    if (window.THREE) { loadFiles(); return; }
    if (idx >= urls.length) {
      if (window.__wzShowErr) window.__wzShowErr('Could not load Three.js from any source.');
      return;
    }
    var s = document.createElement('script');
    s.src = urls[idx];
    s.onload = function () { if (window.THREE) loadFiles(); else loadThree(urls, idx + 1); };
    s.onerror = function () { loadThree(urls, idx + 1); };
    document.body.appendChild(s);
  }
  loadThree([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'vendor/three.min.js'
  ], 0);
})();
</script>
</body>
</html>
