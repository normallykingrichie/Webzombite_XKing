<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webzombite Wiki</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2d323b;--txt:#e9e6dc;--muted:#9aa0a8;--gold:#e3b02a;--red:#d24a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
a{color:var(--gold)}header{position:sticky;top:0;z-index:5;background:#101216ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;margin-right:auto}header h1 b{color:var(--gold)}
input,select,textarea,button{font:inherit;color:var(--txt);background:#262a32;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.pri{background:var(--gold);color:#201a08;border-color:var(--gold);font-weight:700}button.dng{border-color:var(--red);color:#ff9b8d}
main{display:grid;grid-template-columns:230px 1fr;gap:16px;max-width:1150px;margin:0 auto;padding:16px}
nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;height:fit-content;position:sticky;top:64px}
nav button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}nav button.on{background:#2c313b;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;gap:8px;align-items:center;background:#22262d;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;min-height:54px}
.tile:hover{border-color:var(--gold)}.tile .i{width:36px;height:36px;display:grid;place-items:center;font-size:1.6rem;flex:none}.tile .i img,.ic img,img.ico{width:100%;height:100%;object-fit:contain}
.tile span{font-size:.86rem;line-height:1.2}.ic{width:64px;height:64px;display:grid;place-items:center;font-size:3rem;flex:none}
.chip{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;background:#2c313b;color:var(--muted);margin-right:6px}
.top{display:flex;gap:14px;align-items:center;margin-bottom:10px}.top h2{margin:0}.muted{color:var(--muted)}
table.st{border-collapse:collapse;margin:10px 0}table.st td{border:1px solid var(--line);padding:4px 10px}table.st td:first-child{color:var(--muted)}
.body img{max-width:100%;border-radius:8px}.body blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--gold);color:var(--muted)}.body code{background:#0f1114;padding:1px 5px;border-radius:5px}
.ed-tabs button.on{border-color:var(--gold)}#wys{min-height:220px;background:#15171b;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.tb button{padding:4px 9px}textarea{width:100%;min-height:220px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1 1 150px}.row>button{flex:0 0 auto}
.gal{display:flex;gap:6px;flex-wrap:wrap;max-height:130px;overflow:auto;background:#15171b;border:1px solid var(--line);border-radius:10px;padding:6px}.gal img{width:36px;height:36px;cursor:pointer;border-radius:6px;border:2px solid transparent}.gal img:hover{border-color:var(--gold)}
.msg{padding:8px 12px;border-radius:10px;background:#2c313b;margin:8px 0}.err{color:#ff9b8d}
@media(max-width:760px){main{grid-template-columns:1fr}nav{position:static;display:flex;flex-wrap:wrap}nav button{width:auto}}
</style></head>
<body>
<header><h1><b>Webzombite</b> Wiki</h1><input id="q" placeholder="Search..." style="max-width:220px"><span id="who" class="muted"></span><button id="bAuth"></button><a href="index.html" style="text-decoration:none"><button>Back to Game</button></a></header>
<main><nav id="nav"></nav><section id="view"></section></main>
<script src="config.js"></script><script src="data.js"></script><script src="vendor/supabase.js"></script>

    var wys = $('#wys'); wys.innerHTML = sanitize(html); $('#mdT').value = md || html2md(html);

    $('#eF').onchange = function () { var f = this.files[0]; if (!f) return; if (f.size > 2e6) { $('#eMsg').textContent = 'Image must be under 2 MB.'; return; }

      sb.storage.from('wiki').upload(path, f, { upsert: false, contentType: f.type }).then(function (r) { if (r.error) { $('#eMsg').textContent = r.error.message; return; } $('#eI').value = sb.storage.from('wiki').getPublicUrl(path).data.publicUrl; $('#eMsg').textContent = ''; }); };
    $('#eCancel').onclick = function () { history.back(); };
    $('#eSave').onclick = function () {
      if (mode === 'wys') sync('md'); else sync('wys');
      var row = { slug: slug($('#eS').value || $('#eT').value), title: $('#eT').value.trim(), category: $('#eC').value, icon_url: $('#eI').value.trim() || null, redirect_to: slug($('#eR').value) || null, body_md: md, body_html: sanitize(html), updated_by: S.me.id, updated_at: new Date().toISOString() };
      if (!row.slug || !row.title) { $('#eMsg').textContent = 'Title and slug are required.'; return; }
      sb.from('wiki_pages').upsert(row, { onConflict: 'slug' }).then(function (r) { if (r.error) $('#eMsg').textContent = r.error.message; else load().then(function () { location.hash = '#/p/' + row.slug; route(); }); });
    };
  }
  function importAll() {
    var rows = Object.keys(S.builtin).filter(function (k) { return !S.pages[k]; }).map(function (k) { var b = S.builtin[k], ic = (b.icon || '').match(/src="([^"]+)"/); return { slug: b.slug, title: b.title, category: b.category, icon_url: ic ? ic[1] : (b.icon && b.icon.charAt(0) !== '<' ? b.icon : null), body_md: (b.body_md || '') + (b.stats && b.stats.length ? '\n\n' + b.stats.map(function (a) { return '- **' + a[0] + ':** ' + a[1]; }).join('\n') : ''), body_html: null, updated_by: S.me.id }; });
    if (!rows.length) { alert('Everything is already imported.'); return; } if (!confirm('Import ' + rows.length + ' built-in entries as editable wiki pages?')) return;
    var chunks = [], i; for (i = 0; i < rows.length; i += 100) chunks.push(rows.slice(i, i + 100));
    chunks.reduce(function (pr, ch) { return pr.then(function () { return sb.from('wiki_pages').upsert(ch, { onConflict: 'slug', ignoreDuplicates: true }).then(function (r) { if (r.error) throw r.error; }); }); }, Promise.resolve()).then(load).then(route, function (e) { alert(e.message); });
  }
  /* ---------- auth buttons ---------- */
  function authClick() {
    if (!sb) { alert('The sign-in library did not load.'); return; }
    if (S.me && !S.staff || S.admin) { sb.auth.signOut().then(function () { S.me = null; S.staff = S.admin = false; route(); }); return; }
    if (S.me && S.staff) { var pw = prompt('Admin password (leave empty if you are the leader):'); if (pw == null) return;
      sb.rpc('request_admin_session', { p_password: pw }).then(function (r) { if (r.error) { alert(r.error.message); return; } var st = r.data && r.data.status; if (st === 'wrong_password') alert('Wrong password.'); else if (st === 'pending') { alert('Request sent. The leader must approve it in XKing Core; this page will unlock when approved.'); pollAdmin(); } else checkStaff().then(route); }); return; }
    var e = prompt('XKing account email:'); if (!e) return; var pw2 = prompt('Password:'); if (!pw2) return;
    sb.auth.signInWithPassword({ email: e, password: pw2 }).then(function (r) { if (r.error) { alert(r.error.message); return; } S.me = r.data.user; checkStaff().then(route); });
  }
  function pollAdmin() { var n = 0, t = setInterval(function () { if (++n > 60) { clearInterval(t); return; } checkStaff().then(function () { if (S.admin) { clearInterval(t); route(); } }); }, 5000); }
  /* ---------- router ---------- */
  function route() {
    chrome(); var h = location.hash || '#/c/home', m, q = $('#q').value.trim().toLowerCase();
    if (q) { S.cat = 'home'; listView('home', q); return; }
    if ((m = /^#\/p\/([^?]+)(?:\?from=(.*))?$/.exec(h))) { var sl = decodeURIComponent(m[1]); S.cat = (all()[sl] || {}).category || S.cat; chrome(); pageView(sl, m[2] ? decodeURIComponent(m[2]) : ''); }
    else { m = /^#\/c\/(\w+)/.exec(h); S.cat = m ? m[1] : 'home'; chrome(); listView(S.cat, ''); }
    window.scrollTo(0, 0);
  }
  $('#q').oninput = route; $('#bAuth').onclick = authClick; window.addEventListener('hashchange', route);
  window.WZW = { md2html: md2html, html2md: html2md, sanitize: sanitize };
  buildBuiltin(); route();
  initAuth().then(load).then(route, route);
})();
