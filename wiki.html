<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webzombite Wiki</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2d323b;--txt:#e9e6dc;--muted:#9aa0a8;--gold:#e3b02a;--red:#d24a3a;--grn:#5fcf80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
a{color:var(--gold)}header{position:sticky;top:0;z-index:5;background:#101216ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;margin-right:auto}header h1 b{color:var(--gold)}header h1 a{text-decoration:none;color:inherit}
input,select,textarea,button{font:inherit;color:var(--txt);background:#262a32;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.pri{background:var(--gold);color:#201a08;border-color:var(--gold);font-weight:700}button.dng{border-color:var(--red);color:#ff9b8d}
main{display:grid;grid-template-columns:210px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;height:fit-content;position:sticky;top:64px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}nav button.on{background:#2c313b;border-color:var(--gold)}
nav .n{font-size:.72rem;color:var(--muted)}nav .nw{background:var(--grn);color:#08210f;border-radius:99px;padding:0 7px;font-weight:700;font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.cat{background:#22262d;border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer}.cat:hover{border-color:var(--gold)}.cat .e{font-size:2rem;height:44px;display:grid;place-items:center}.cat .e img{height:44px}.cat b{display:block}.cat small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:flex;gap:8px;align-items:center;background:#22262d;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;min-height:54px;position:relative}
.tile:hover{border-color:var(--gold)}.tile .i{width:36px;height:36px;display:grid;place-items:center;font-size:1.6rem;flex:none}.tile .i img,.ic img{width:100%;height:100%;object-fit:contain}
.tile span{font-size:.86rem;line-height:1.2}.tile .nb{position:absolute;top:3px;right:6px;font-size:.62rem;background:var(--grn);color:#08210f;border-radius:99px;padding:0 6px;font-weight:700}
.ic{width:72px;height:72px;display:grid;place-items:center;font-size:3.2rem;flex:none}
/* sprite-sheet icons */
.ico.sp{display:inline-block;width:1.5em;height:1.5em;background-size:2000% 2000%;background-repeat:no-repeat;vertical-align:-.35em}.sp0{background-image:url(icons/atlas0.webp)}.sp1{background-image:url(icons/atlas1.webp)}.sp2{background-image:url(icons/atlas2.webp)}.sp3{background-image:url(icons/atlas3.webp)}.tile .i .ico,.cat .e .ico{width:100%;height:100%}.ic .ico{width:72px;height:72px}.gal .ico{width:36px;height:36px;cursor:pointer;border-radius:6px;border:2px solid transparent;vertical-align:top}.gal .ico:hover{border-color:var(--gold)}.pick .ico{width:22px;height:22px}
img.ico{width:1.5em!important;height:1.5em!important;max-width:1.5em;vertical-align:middle;object-fit:contain;display:inline-block}
.chip{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;background:#2c313b;color:var(--muted);margin-right:6px}.chip.g{background:var(--grn);color:#08210f}
.top{display:flex;gap:14px;align-items:center;margin-bottom:10px}.top h2{margin:0}.muted{color:var(--muted)}
table.st{border-collapse:collapse;margin:10px 0;min-width:260px}table.st td{border:1px solid var(--line);padding:4px 10px}table.st td:first-child{color:var(--muted)}
.box{border-left:3px solid var(--gold);background:#22262d;border-radius:8px;padding:8px 12px;margin:10px 0}.box b{color:var(--gold)}
.body img{max-width:100%;border-radius:8px}.body blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--gold);color:var(--muted)}.body code{background:#0f1114;padding:1px 5px;border-radius:5px}
.ed-tabs button.on{border-color:var(--gold)}#wys{min-height:200px;background:#15171b;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.tb button{padding:4px 9px}textarea{width:100%;min-height:90px;font-family:inherit}#mdT{min-height:220px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:1 1 150px}.row>button{flex:0 0 auto}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.flt select,.flt input{flex:0 1 auto;padding:6px 10px}
.pill{padding:4px 12px;border-radius:99px;font-size:.82rem}.pill.on{background:var(--gold);color:#201a08;border-color:var(--gold)}
.gal{display:flex;gap:6px;flex-wrap:wrap;max-height:130px;overflow:auto;background:#15171b;border:1px solid var(--line);border-radius:10px;padding:6px}.gal img{width:36px;height:36px;cursor:pointer;border-radius:6px;border:2px solid transparent}.gal img:hover{border-color:var(--gold)}
.srow{display:flex;gap:6px;margin:4px 0}.srow input{flex:1}.srow button{flex:0 0 auto;padding:6px 10px}
.msg{padding:8px 12px;border-radius:10px;background:#2c313b;margin:8px 0}.err{color:#ff9b8d}
@media(max-width:760px){main{grid-template-columns:1fr}nav{position:static;display:flex;flex-wrap:wrap}nav button{width:auto}}
</style></head>
